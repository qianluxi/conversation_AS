name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,web]" ruff
      - name: Syntax / undefined-name checks
        run: |
          python -m compileall -q agentorchestrator tests
          ruff check agentorchestrator tests --select E9,F63,F7,F82
      - name: Tests
        run: python -m pytest -q
