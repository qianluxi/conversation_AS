[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorchestrator"
version = "0.2.0"
description = "WorkBuddy + OpenCode 双智能体编排器（第一阶段：双向通信）"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
agentorchestrator = "agentorchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["agentorchestrator*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
