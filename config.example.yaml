# WorkBuddy + OpenCode 编排器配置（复制为 config.yaml 后修改）
# 所有字符串值都支持 ${ENV_VAR} 与 ${ENV_VAR:-默认值} 展开。

agents:
  # 实验性：通过 WorkBuddy 桌面端本地 IPC 调用内置 chat 接口，无需 OAuth。
  # 需要 WorkBuddy 正在运行并已登录；属于内部接口，WorkBuddy 升级后可能失效。
  workbuddy:
    type: workbuddy_ipc
    client_id: conversation-as
    client_kind: skill
    model: auto
    chat_path: /v2/chat/completions
    timeout: 3600
    history_limit: 20
    # 一般可自动发现；如提示找不到，手动指向：
    # library_path: D:/Program Files/WorkBuddy/resources/app.asar.unpacked/resources/plugins/workbuddy-builtin/skills/library

  # 官方 OAuth 本地助理（个人开发者通常无法申请到 localassistant scope，保留备用）
  # workbuddy_openapi:
  #   type: workbuddy_local
  #   base_url: https://www.workbuddy.cn
  #   client_id: ${WORKBUDDY_CLIENT_ID}
  #   client_secret: ${WORKBUDDY_CLIENT_SECRET}
  #   redirect_uri: ${WORKBUDDY_REDIRECT_URI}
  #   scope: "user.localassistant.readable user.localassistant.invokable"
  #   token_file: data/workbuddy_token.json
  #   timeout: 3600
  #   poll_interval: 2
  #   lock_file: data/workbuddy_local.lock

  # 官方 OAuth 云端任务（ACP：SSE + JSON-RPC 2.0）
  # workbuddy_acp:
  #   type: workbuddy_acp
  #   base_url: https://www.workbuddy.cn
  #   client_id: ${WORKBUDDY_CLIENT_ID}
  #   client_secret: ${WORKBUDDY_CLIENT_SECRET}
  #   redirect_uri: ${WORKBUDDY_REDIRECT_URI}
  #   scope: "user.task.readable user.task.invokable"
  #   token_file: data/workbuddy_token.json
  #   bootstrap_prompt: "初始化协作会话，请等待后续指令。"
  #   cwd: /workspace
  #   timeout: 3600
  #   inactivity_timeout: 0   # 无活动检测，0 关闭；有 chunk/工具事件会刷新
  #   poll_interval: 2
  #   auto_approve: false   # true 仅自动允许 allow_once；ask 在 Web UI 中人工确认，超时拒绝
  #   # 工具授权策略：token 级匹配 operation（不是任意子串），复合操作取最严格
  #   # 可用 operation：read / write / test / network / execute / delete / install
  #   permissions:
  #     allow: [read]
  #     ask: [write, test, network]
  #     deny: [execute, delete, install]

  opencode:
    type: opencode
    base_url: ${OPENCODE_BASE_URL:-http://127.0.0.1:4096}
    username: opencode
    password: ${OPENCODE_SERVER_PASSWORD}
    # legacy: /session + /session/:id/prompt_async（兼容性最好）
    # v2:     /api/session + /api/session/:id/prompt + /wait（1.19+）
    api_style: legacy
    # async: 先提交再轮询（推荐，可取消）；sync: 直接阻塞等待（仅 legacy）
    delivery: async
    # OpenCode 工作目录；不填则使用 OpenCode 服务端默认目录，建议填绝对路径。
    # directory: F:/PyProjects/conversation_AS
    # 可选：固定 agent / 模型
    # agent: build   # build 可修改代码；plan 只读检查（界面可按次覆盖）
    # provider_id: opencode-go
    # model_id: deepseek-v4.1-flash
    timeout: 3600
    # 单次 HTTP 查询/控制请求上限；与 Agent 响应上限分离，避免轮询请求卡住看门狗。
    request_timeout: 30
    # 用户明确请求中止时的 HTTP 上限。
    cancel_timeout: 8
    # 无活动超时：0 表示关闭。仅在没有任何运行中工具时生效；
    # 运行 npm install/build/test 等长命令不会因暂时无输出被中止。
    inactivity_timeout: 0
    # 额外允许外部读写的目录；工作区和系统临时目录始终自动允许。
    # 其他外部目录会通过 Web UI 弹出权限确认，超时默认拒绝。
    external_directory_allow: []
    poll_interval: 1

  # 离线演示/测试用，不访问网络
  # mock_planner:
  #   type: mock
  #   role: planner

storage:
  path: data/orchestrator.db

# 只读验证的文件树指纹排除目录（也会在 UI 的校验信息中展示）
verification:
  exclude_dirs: [.git, data, logs, __pycache__, .pytest_cache, .mypy_cache,
                 .ruff_cache, .venv, venv, node_modules, dist, build]
  max_files: 50000
  max_total_bytes: 536870912
  max_file_bytes: 67108864
  scan_timeout: 30

log_level: INFO
