[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agentorchestrator"
version = "0.6.3"
description = "Reliable multi-agent orchestrator for local AI development (WorkBuddy / OpenCode / ACP)"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.5",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]
web = ["fastapi>=0.110", "uvicorn>=0.27"]

[project.scripts]
agentorchestrator = "agentorchestrator.cli:main"

[tool.setuptools.packages.find]
include = ["agentorchestrator*"]

[tool.setuptools.package-data]
agentorchestrator = ["api/static/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
